<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 616">
  <!-- 06 · Check in anywhere. NOT from a design file — section 06 was never
       drawn. It is the check-in background, unchanged, plus the COMPASS from
       01_Authentication launch_motifs.svg, which is the only motif added.
       Asked for directly: "remove the dancing lady and add the compass".
       Geometry copied byte for byte from the launch screen; only the
       stroke-opacity is lowered from .3/.16 to .13/.07 so it sits in the same
       register as the dashed paths beside it rather than shouting over the
       content.

       THE SCALE IS THE LAUNCH SCREEN'S OWN, AND MUST STAY THAT WAY. An SVG
       transform scales stroke-width along with the geometry, so enlarging the
       compass thickens every line in it. It was enlarged here once and read as
       bloated beside the hairline dashed paths, and it overran the right edge
       of the artboard as well. Move it if you need to; do not grow it. See
       B40. -->
<g stroke="#fff" fill="none" stroke-linecap="round">
      <path d="M-8 178 Q66 148 140 170 T240 148" stroke-opacity=".12" stroke-width="1.2" stroke-dasharray="5 9"/>
      <path d="M-8 558 Q70 584 148 556 T240 572" stroke-opacity=".1" stroke-width="1.2" stroke-dasharray="5 9"/>
    </g>
  <g stroke="#fff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(184 500) scale(.9)">
      <g stroke-opacity=".13" stroke-width="1.3">
          <circle r="19"/><circle r="13"/>
          <path d="M0 -10 L4.5 0 L0 10 L-4.5 0 Z"/>
          <circle cy="-24" r="3.6"/><path d="M0 -20.4 v-1"/>
          <path d="M22 0 h4 M-22 0 h-4 M0 22 v4"/>
          <path d="M15.5 -15.5 l2.8 -2.8 M15.5 15.5 l2.8 2.8 M-15.5 15.5 l-2.8 2.8 M-15.5 -15.5 l-2.8 -2.8"/>
        </g>
        <g stroke-opacity=".07" stroke-width="1.1" transform="translate(.7 -.6) rotate(1.4)">
          <circle r="19"/><circle r="13"/><path d="M0 -10 L4.5 0 L0 10 L-4.5 0 Z"/>
        </g>
    </g>
  </g>
</svg>
