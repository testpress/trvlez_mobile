name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality_gates:
    name: Architecture & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify Style Guard (No Raw Colors in Features)
        run: |
          ! grep -rnE "Color\(0x|Colors\.(red|blue|green|grey)" lib/features/

      - name: Verify Layer Import Guard (Zero Data Imports in UI)
        run: |
          ! grep -rnE "import .*/data/" lib/features/*/presentation/ --exclude-dir=providers

      - name: Run Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test
