name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality_gates:
    name: Architecture & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify Style Guard (No Raw Colors in Features)
        run: |
          ! grep -rnE "Color\(0x|Colors\.(red|blue|green|grey)" lib/features/

      - name: Verify Semantic Layout Tokens Guard
        run: |
          python3 scripts/test_verify_layout_tokens.py
          python3 scripts/verify_layout_tokens.py

      - name: Verify Screenshot Evidence Metadata
        run: python3 scripts/test_write_capture_metadata.py

      - name: Verify Layer Import Guard (Zero Data Imports in Presentation)
        run: |
          ! grep -rnE "(import|export) .*/data/" lib/features/*/presentation/
          ! grep -rnE "(import|export) .*/data/" lib/ | grep -v "lib/features/[^/]*/data/" | grep -v "lib/core/providers/repository_providers.dart"

      - name: Run Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Test Suite
        run: flutter test

      - name: Upload Golden Failures Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-failures
          path: test/**/failures/
          if-no-files-found: ignore
